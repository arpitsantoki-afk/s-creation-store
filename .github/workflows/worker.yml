name: Deploy API worker

on:
  push:
    branches: [main]
    paths: ['worker/**', 'shared/**', 'content/**', '.github/workflows/worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
        working-directory: worker
      - name: Apply database schema (idempotent)
        run: npx wrangler d1 execute screation --remote --file=schema.sql
        working-directory: worker
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
      - name: Deploy
        run: npx wrangler deploy
        working-directory: worker
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
