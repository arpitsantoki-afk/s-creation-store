name: Build & deploy storefront

on:
  push:
    branches: [main]
    paths: ['site/**', 'content/**', 'shared/**', 'admin/**', '.github/workflows/site.yml']
  repository_dispatch:
    types: [publish]          # sent by the dashboard "Publish site" button
  workflow_run:
    workflows: ['Deploy API worker']   # rebuild after the API deploys
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'    # safety net: rebuild every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Detect the site domain
        id: dom
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # The custom domain set under Settings → Pages wins; otherwise the github.io preview path is used.
          CNAME=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages" | jq -r '.cname // empty' || true)
          if [ -n "$CNAME" ]; then
            echo "site=https://$CNAME" >> "$GITHUB_OUTPUT"; echo "base=" >> "$GITHUB_OUTPUT"; echo "custom=$CNAME" >> "$GITHUB_OUTPUT"
          else
            echo "site=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"; echo "base=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Site: ${CNAME:-github.io preview}" >> "$GITHUB_STEP_SUMMARY"
      - name: Find the API URL
        id: api
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ vars.API_URL }}" ]; then echo "url=${{ vars.API_URL }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          # api.<domain> is attached by the Worker deploy when CUSTOM_DOMAIN=true; until then use workers.dev.
          if [ "${{ vars.CUSTOM_DOMAIN }}" = "true" ] && [ -n "${{ steps.dom.outputs.custom }}" ]; then echo "url=https://api.${{ steps.dom.outputs.custom }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            SUB=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            [ -n "$SUB" ] && echo "url=https://screation-api.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
          fi
          true
      - name: Build static site from the live API
        run: node site/build.mjs
        env:
          API_URL: ${{ steps.api.outputs.url }}         # empty = build from content/
          PUBLIC_API_URL: ${{ steps.api.outputs.url }}
          BASE_PATH: ${{ steps.dom.outputs.base }}
          SITE_URL: ${{ steps.dom.outputs.site }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
